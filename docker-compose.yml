services:
  pm4py:
    image: pm4py-llm
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pm4py-llm-container
    volumes:
      - .:/pm4py-llm
    ports:
      - "8001:8001"

  api:
    build:
      context: ./api
    container_name: api-container
    ports:
      - "8000:8000"
    depends_on:
      - pm4py
    volumes:
      - ./api:/api
