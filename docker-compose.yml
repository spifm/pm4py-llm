services:
  app:
    image: pm4py-llm-app
    build:
      context: ./app
    container_name: pm4py-llm-app-container
    ports:
      - "8001:8001"
    volumes:
      - ./app:/app
    env_file:
      - .env

  api:
    image: pm4py-llm-api
    build:
      context: ./api
    container_name: pm4py-llm-api-container
    ports:
      - "8000:8000"
    volumes:
      - ./api/source:/app
    env_file:
      - .env
    depends_on:
      - app

  moodle-data-service:
    image: moodle-data-service
    build:
      context: ./moodle-data-service
    container_name: moodle-data-service-container
    ports:
      - "8002:8002"
    volumes:
      - ./moodle-data-service/source:/app/source
      - ./data/moodle-exports:/data
    env_file:
      - .env


